      url: https://github.com/rustdesk-org/flutter_custom_cursor
      ref: db63b785c38153603e9fb84b50d3ec46f0d7e05e
  window_size:
    git:
      url: https://github.com/21pages/flutter-desktop-embedding.git
      path: plugins/window_size
      ref: 51e67ce047c72b26810b99e8473ddb44612fe356
  get: ^4.6.5
  visibility_detector: ^0.4.0+2
  contextmenu: ^3.0.0
  desktop_drop: ^0.4.4
  scroll_pos: ^0.4.0
  debounce_throttle: ^2.0.0
  file_picker: ^12.2.0
  flutter_svg: ^2.0.5
  uni_links:
    git:
      url: https://github.com/rustdesk-org/uni_links
      path: uni_links
      ref: f416118d843a7e9ed117c7bb7bdc2deda5a9e86f
  uni_links_desktop: ^0.1.6 # use 0.1.6 to make flutter 3.13 works
  path: ^1.8.1
  auto_size_text: ^3.0.0
  bot_toast: ^4.0.3
  win32: any
  password_strength: ^0.2.0
  flutter_keyboard_visibility: ^6.0.0
  texture_rgba_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_texture_rgba_renderer
      ref: 42797e0f03141dc2b585f76c64a13974508058b4
  percent_indicator: ^4.2.2
  dropdown_button2: ^2.0.0
  flutter_gpu_texture_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_gpu_texture_renderer
      ref: 08a471bb8ceccdd50483c81cdfa8b81b07b14b87
  uuid: ^3.0.7
  auto_size_text_field: ^2.2.1
  flex_color_picker: ^3.3.0
  dynamic_layouts:
    git:
      url: https://github.com/rustdesk-org/dynamic_layouts.git
      ref: 24cb88413fa5181d949ddacbb30a65d5c459e7d9
  pull_down_button: ^0.9.3
  device_info_plus: ^13.3.0
  qr_flutter: ^4.1.0
  extended_text: 15.0.2
  xterm: 4.0.0
  sqflite: ^2.4.4
  google_fonts: ^8.1.0
  vector_math: ^2.1.4


flutter:
  plugin:
    platforms:
      android:
        package: com.carriez.flutter_hbb
        pluginClass: LocalistRemotePlugin
