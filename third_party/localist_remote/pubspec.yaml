name: flutter_hbb
description: Your Remote Desktop Software

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 1.1.9-1 works for android, but for ios it becomes 1.1.91, need to set it to 1.1.9-a.1 for iOS, will get 1.1.9.1, but iOS store not allow 4 numbers
version: 1.5.0+68

environment:
  sdk: '^3.1.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ffi: ^2.1.0
  path_provider: ^2.1.1
  provider: ^6.0.5
  tuple: ^2.0.0
  wakelock_plus: ^1.1.3
  #firebase_analytics: ^9.1.5
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  url_launcher_ios: ^6.3.2
  toggle_switch: ^2.1.0
  dash_chat_2:
    git:
      url: https://github.com/rustdesk-org/Dash-Chat-2
      ref: bd6b5b41254e57c5bcece202ebfb234de63e6487
  draggable_float_widget: ^0.1.0
  settings_ui: ^2.0.2
  flutter_breadcrumb: ^1.0.1
  http: ^1.1.0
  mobile_scanner: ^7.2.0
  zxing2: ^0.2.0
  image_picker: ^1.1.2
  image: ^4.0.17
  back_button_interceptor: ^6.0.1
  flutter_rust_bridge: "1.80.1"
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager
      ref: cf4aef0512092fad9344a27ffe1c47ad83269dfc
  desktop_multi_window:
    git:
      url: https://github.com/rustdesk-org/rustdesk_desktop_multi_window
      ref: cddc2e64f8fefce4f80db87b20bcda2dd019bed6
  freezed_annotation: ^2.0.3
  flutter_custom_cursor:
