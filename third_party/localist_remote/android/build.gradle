group 'com.carriez.flutter_hbb'
version '1.0'

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.carriez.flutter_hbb'
    compileSdk 37
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    buildTypes { release { consumerProguardFiles 'consumer-rules.pro' } }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url uri('maven'); metadataSources { artifact() } }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'rustls:rustls-platform-verifier:0.1.1@aar'
}
