<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Localist • Camera & Mic</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101519;color:#e0e8ed}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:1fr auto}
video{width:100%;height:calc(100vh - 88px);object-fit:contain;background:#000}
footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px}
button,select{background:#9dccff;color:#09243d;border:0;border-radius:16px;padding:10px 16px;font:inherit;cursor:pointer}
#state{flex:1}body.obs video{height:100vh}body.obs footer{display:none}
</style><video id="media" autoplay playsinline></video><footer>
<span id="state">در حال اتصال • Connecting…</span>
<button id="play">فعال‌کردن صدا • Enable sound</button>
<button id="mute">بی‌صدا • Mute</button>
<button id="mirror">آینه • Mirror</button>
<button id="full">تمام صفحه • Fullscreen</button>
<button id="retry">اتصال مجدد • Reconnect</button>
</footer><script>
'use strict';
const video=document.getElementById('media'),state=document.getElementById('state');
const key=location.hash.slice(1),obs=new URLSearchParams(location.search).has('obs');
if(obs)document.body.classList.add('obs');
let socket,peer,queue=Promise.resolve(),pending=[],mirror=false,retryTimer,closed=false;
function message(text){state.textContent=text;}
function stop(){clearTimeout(retryTimer);closed=true;if(socket)socket.close();if(peer)peer.close();video.srcObject=null;}
function retry(){if(!closed)retryTimer=setTimeout(connect,3000);}
function connect(){
 stop();closed=false;pending=[];queue=Promise.resolve();
 if(!/^[A-Za-z0-9_=-]{40,64}$/.test(key)){message('لینک ناقص است؛ لینک کامل را از برنامه کپی کنید. • Invalid link');return;}
 message('در حال اتصال • Connecting…');
 peer=new RTCPeerConnection({iceServers:[]});
 const current=peer;
 peer.ontrack=event=>{if(event.streams.length)video.srcObject=event.streams[0];video.play().catch(()=>message('برای شروع صدا دکمه را بزنید • Tap Enable sound'));};
 peer.onicecandidate=event=>{if(event.candidate&&socket?.readyState===1)socket.send(JSON.stringify({candidate:event.candidate.toJSON()}));};
 peer.onconnectionstatechange=()=>{if(peer!==current)return;message(peer.connectionState==='connected'?'متصل • Connected':peer.connectionState);if(peer.connectionState==='failed')retry();};
 socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/signal?key=${encodeURIComponent(key)}`);
 socket.onmessage=event=>{queue=queue.then(async()=>{
  if(peer!==current)return;
  const data=JSON.parse(event.data);
  if(data.type==='offer'){
   await peer.setRemoteDescription({type:'offer',sdp:data.sdp});
   for(const candidate of pending)await peer.addIceCandidate(candidate);pending=[];
   await peer.setLocalDescription(await peer.createAnswer());
   socket.send(JSON.stringify({type:'answer',sdp:peer.localDescription.sdp}));
  }else if(data.candidate){if(peer.remoteDescription)await peer.addIceCandidate(data.candidate);else if(pending.length<100)pending.push(data.candidate);}
 }).catch(()=>{message('اتصال ناموفق؛ دوباره تلاش کنید • Connection failed');});};
 socket.onclose=()=>{if(peer===current){message('ارتباط قطع شد یا ظرفیت تکمیل است • Disconnected / viewer limit');retry();}};
 socket.onerror=()=>message('دستگاه و لینک اتصال را بررسی کنید • Check device and pairing link');
}
document.getElementById('play').onclick=()=>{video.muted=false;video.play().catch(()=>{});};
document.getElementById('mute').onclick=()=>video.muted=!video.muted;
document.getElementById('mirror').onclick=()=>{mirror=!mirror;video.style.transform=mirror?'scaleX(-1)':'';};
document.getElementById('full').onclick=()=>video.requestFullscreen?.();
document.getElementById('retry').onclick=connect;
window.addEventListener('pagehide',stop);connect();
</script></html>
