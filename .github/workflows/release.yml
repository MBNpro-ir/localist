name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to create or update. Leave empty to use pubspec.yaml.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pubspec version
        shell: bash
        run: |
          version_line="$(grep -E '^version:[[:space:]]*' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//')"
          app_version="${version_line%%+*}"
          build_number="${version_line#*+}"
          if [ "$build_number" = "$version_line" ]; then
            build_number="1"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Restore packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --tree-shake-icons \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android-aab \
            --tree-shake-icons \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Stage Android assets
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/android/localist-v${APP_VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/android/localist-v${APP_VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release/android/localist-v${APP_VERSION}-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/android/localist-v${APP_VERSION}-android-universal.aab"
          7z a -tzip -mx=9 "release/localist-v${APP_VERSION}-android-symbols.zip" build/symbols/android build/symbols/android-aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localist-android
          path: |
            release/android/*
            release/*-android-symbols.zip
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows release x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pubspec version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $versionLine = $match.Matches[0].Groups[1].Value.Trim()
          $parts = $versionLine -split '\+', 2
          $appVersion = $parts[0]
          $buildNumber = if ($parts.Count -gt 1) { $parts[1] } else { '1' }
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Build Windows x64
        shell: pwsh
        run: |
          flutter build windows --release `
            --obfuscate `
            --split-debug-info=build\symbols\windows-x64 `
            --tree-shake-icons `
            --build-name=$env:APP_VERSION `
            --build-number=$env:BUILD_NUMBER

      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $sevenZip a -tzip -mx=9 "release\localist-v${env:APP_VERSION}-windows-x64.zip" .\build\windows\x64\runner\Release\*
          & $sevenZip a -tzip -mx=9 "release\localist-v${env:APP_VERSION}-windows-x64-symbols.zip" .\build\symbols\windows-x64\*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localist-windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 9

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - windows

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pubspec version
        shell: bash
        run: |
          version_line="$(grep -E '^version:[[:space:]]*' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//')"
          app_version="${version_line%%+*}"
          build_number="${version_line#*+}"
          if [ "$build_number" = "$version_line" ]; then
            build_number="1"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Resolve release tag
        shell: bash
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            release_tag="$INPUT_RELEASE_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v${APP_VERSION}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Localist v${APP_VERSION}

          Bug fix release for realtime stats, Windows desktop sizing,
          and the 1.1.2 release package.

          ## Changes

          - Refreshes the Stats sheet every second while it is open so traffic counters update in realtime.
          - Changes the fixed Windows desktop window size to 450x750.
          - Bumps the app version to v${APP_VERSION}.

          ## Assets

          - Android split APKs: armeabi-v7a, arm64-v8a, x86_64
          - Android App Bundle: universal AAB
          - Windows Desktop: x64 ZIP package
          - Split debug symbols are uploaded as separate ZIP files for crash symbolication.
          EOF

      - name: Publish or update release
        run: |
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Localist v${APP_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GH_REPO"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Localist v${APP_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GH_REPO"
          fi
