name: Release v1

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to create or update.
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"
  BUILD_NUMBER: "1"

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Restore packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --tree-shake-icons \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android-aab \
            --tree-shake-icons \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Stage Android assets
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/localist-v1-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/localist-v1-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/localist-v1-android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/localist-v1-android-universal.aab
          7z a -tzip -mx=9 release/localist-v1-android-symbols.zip build/symbols/android build/symbols/android-aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localist-v1-android
          path: |
            release/android/*
            release/localist-v1-android-symbols.zip
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows release x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Build Windows x64
        run: >
          flutter build windows --release
          --obfuscate
          --split-debug-info=build\symbols\windows-x64
          --tree-shake-icons
          --build-name=${{ env.APP_VERSION }}
          --build-number=${{ env.BUILD_NUMBER }}

      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $sevenZip a -tzip -mx=9 release\localist-v1-windows-x64.zip .\build\windows\x64\runner\Release\*
          & $sevenZip a -tzip -mx=9 release\localist-v1-windows-x64-symbols.zip .\build\symbols\windows-x64\*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localist-v1-windows-x64
          path: |
            release/localist-v1-windows-x64.zip
            release/localist-v1-windows-x64-symbols.zip
          if-no-files-found: error
          compression-level: 9

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - windows

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Localist v1

          Release build for Android and Windows.

          ## Assets

          - Android split APKs: armeabi-v7a, arm64-v8a, x86_64
          - Android App Bundle: universal AAB
          - Windows Desktop: x64 ZIP package
          - Split debug symbols are uploaded as separate ZIP files for crash symbolication.
          EOF

      - name: Publish or update release
        run: |
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Localist v1" \
              --notes-file RELEASE_NOTES.md
          fi
