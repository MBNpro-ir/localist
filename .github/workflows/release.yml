name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to create or update. Leave empty to use pubspec.yaml.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag || 'pubspec' }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pubspec version
        shell: bash
        run: |
          version_line="$(grep -E '^version:[[:space:]]*' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//')"
          app_version="${version_line%%+*}"
          build_number="${version_line#*+}"
          if [ "$build_number" = "$version_line" ]; then
            build_number="1"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Restore packages
        run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Stage Android assets
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/localist-v${APP_VERSION}-android-32bit.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/localist-v${APP_VERSION}-android-64bit.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localist-android
          path: release/*.apk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows release x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pubspec version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $versionLine = $match.Matches[0].Groups[1].Value.Trim()
          $parts = $versionLine -split '\+', 2
          $appVersion = $parts[0]
          $buildNumber = if ($parts.Count -gt 1) { $parts[1] } else { '1' }
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Restore packages
        run: flutter pub get

      - name: Download Windows Wintun tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsDir = Join-Path $PWD 'windows\runner\resources'
          New-Item -ItemType Directory -Force $toolsDir | Out-Null

          $tun2socksVersion = 'v2.6.0'
          $tun2socksZip = Join-Path $env:RUNNER_TEMP 'tun2socks.zip'
          $tun2socksDir = Join-Path $env:RUNNER_TEMP 'tun2socks'
          $tun2socksAssets = @(
            "tun2socks-windows-amd64.zip",
            "tun2socks-windows-amd64-v3.zip"
          )
          $downloadedTun2socks = $false
          foreach ($asset in $tun2socksAssets) {
            try {
              Invoke-WebRequest `
                -Uri "https://github.com/xjasonlyu/tun2socks/releases/download/$tun2socksVersion/$asset" `
                -OutFile $tun2socksZip
              $downloadedTun2socks = $true
              break
            } catch {
              Write-Host "Unable to download $asset, trying next asset name."
            }
          }
          if (-not $downloadedTun2socks) {
            throw 'Unable to download a Windows amd64 tun2socks release archive.'
          }
          Expand-Archive -Path $tun2socksZip -DestinationPath $tun2socksDir -Force
          $tun2socksExe = Get-ChildItem -Path $tun2socksDir -Recurse -Filter '*.exe' |
            Select-Object -First 1
          if (-not $tun2socksExe) {
            throw 'tun2socks.exe was not found in the release archive.'
          }
          Copy-Item -Path $tun2socksExe.FullName -Destination (Join-Path $toolsDir 'tun2socks.exe') -Force

          $wintunZip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $wintunDir = Join-Path $env:RUNNER_TEMP 'wintun'
          Invoke-WebRequest `
            -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' `
            -OutFile $wintunZip
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $wintunDll = Get-ChildItem -Path $wintunDir -Recurse -Filter 'wintun.dll' |
            Where-Object { $_.FullName -match '\\amd64\\' } |
            Select-Object -First 1
          if (-not $wintunDll) {
            throw 'amd64 wintun.dll was not found in the Wintun archive.'
          }
          Copy-Item -Path $wintunDll.FullName -Destination (Join-Path $toolsDir 'wintun.dll') -Force

      - name: Build Windows x64
        shell: pwsh
        run: |
          flutter build windows --release `
            --tree-shake-icons `
            --build-name=$env:APP_VERSION `
            --build-number=$env:BUILD_NUMBER

      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "release\localist-v${env:APP_VERSION}-windows-64bit.zip"
          if (Test-Path $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive `
            -Path .\build\windows\x64\runner\Release\* `
            -DestinationPath $archive `
            -CompressionLevel Optimal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localist-windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 9

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - android
      - windows

    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pubspec version
        shell: bash
        run: |
          version_line="$(grep -E '^version:[[:space:]]*' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//')"
          app_version="${version_line%%+*}"
          build_number="${version_line#*+}"
          if [ "$build_number" = "$version_line" ]; then
            build_number="1"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Resolve release tag
        shell: bash
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            release_tag="$INPUT_RELEASE_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v${APP_VERSION}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare compiled release files
        shell: bash
        run: |
          rm -rf compiled
          mkdir -p compiled

          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            cp "$file" compiled/
          done

          find compiled -type f | sort

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Localist v${APP_VERSION}

          Localist v${APP_VERSION} improves Smart VPN sharing and makes Quick Send discovery, selection, and multi-device delivery more reliable while keeping the existing Localist interface.

          ## Changes

          - Uses one Smart QR/configuration for Android-to-Android and Android-to-Windows handoff; iPhone/Xray configurations remain separate for every advertised IP.
          - Selects a reachable Sharing address automatically and keeps the intended device identity pinned.
          - Adds File, Media, Paste, Text, and Folder choices to Quick Send.
          - Adds long-press multi-device selection and concurrent delivery with an in-app tip.
          - Improves discovery on Wi-Fi, Ethernet, hotspot, and USB tethering with per-interface multicast, directed broadcast, and active subnet registration scans.
          - Keeps Localist's own discovery and transfer traffic on the underlying Android LAN while its VPN is active.
          - Removes invalid 0.0.0.0 discovery sends and advertises the real Android phone model instead of localhost.
          - Saves Android receives under /Localist by default, grouped into media/document/archive/app categories, while preserving custom destinations.
          - Preserves safe relative folder paths and rejects path traversal during receive.
          - Keeps LocalSend v2.1 and legacy v1 compatibility, HTTPS fingerprint checks, PIN protection, favorites, Quick Save, and transfer progress.
          - Keeps the existing Localist light/dark and simple/glass visual styles.
          - Windows can now download, install, restart, and confirm a new Localist version automatically.

          ## Assets

          - Android 32-bit APK
          - Android 64-bit APK
          - Windows 64-bit ZIP package
          EOF

      - name: Publish or update release
        run: |
          mapfile -t files < <(find compiled -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Localist v${APP_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Localist v${APP_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GH_REPO" || \
            gh release edit "$RELEASE_TAG" \
              --title "Localist v${APP_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GH_REPO"
          fi

          mapfile -t existing_assets < <(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
          for asset in "${existing_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GH_REPO"
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GH_REPO"
